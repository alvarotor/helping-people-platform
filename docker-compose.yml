name: helping-people

services:
  gateway:
    image: nginx:1.29.1-alpine
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../helping-people
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin:
    build:
      context: ../helping-people
      dockerfile: apps/admin/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../helping-people
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-helping_people}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-helping_people}?sslmode=disable
      AI_GRPC_ADDR: ai:50051
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: ../helping-people
      dockerfile: apps/auth/Dockerfile
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://${POSTGRES_USER:-helping_people}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-helping_people}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai:
    build:
      context: ../helping-people
      dockerfile: apps/ai/Dockerfile
    expose:
      - "50051"
      - "8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helping_people}
      POSTGRES_USER: ${POSTGRES_USER:-helping_people}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
